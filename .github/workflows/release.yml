name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Determine version
        id: ver
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${crate_version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}" >&2
              exit 1
            fi
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${crate_version}-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (static musl binary)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          name="joplin-todo-${{ steps.ver.outputs.name }}-${{ matrix.arch }}-linux"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/todo" LICENSE README.md "$name/"
          strip "$name/todo" || true
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # Smoke test (only possible for the runner's own architecture).
          "$name/todo" --version

      - uses: actions/upload-artifact@v4
        with:
          name: joplin-todo-${{ matrix.arch }}
          path: |
            joplin-todo-*.tar.gz
            joplin-todo-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" --generate-notes
