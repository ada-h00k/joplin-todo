[package]
name = "joplin-todo"
version = "0.2.1"
edition = "2021"
rust-version = "1.70"
description = "Create Joplin to-do notes from the Linux command line"
license = "AGPL-3.0-or-later"
readme = "README.md"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
