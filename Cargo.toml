[package]
name = "joplin-todo"
version = "0.2.1"
edition = "2021"
rust-version = "1.70"
description = "A small CLI tool for creating to-do notes in Joplin Desktop"
license = "AGPL-3.0-or-later"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
